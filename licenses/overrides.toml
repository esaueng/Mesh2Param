schema_version = 1

[policy]
allowed_license_tokens = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "CC-BY-4.0",
  "CC0-1.0",
  "HPND",
  "ISC",
  "LicenseRef-Matplotlib",
  "LGPL-2.1-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MIT-0",
  "MIT-CMU",
  "MPL-2.0",
  "OFL-1.1",
  "PSF-2.0",
  "Python-2.0",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]
forbidden_fragments = [
  "AGPL",
  "GPL-2.0",
  "GPL-3.0",
  "LGPL",
  "SSPL",
  "BUSL",
  "COMMONS-CLAUSE",
  "CC-BY-NC",
  "UNLICENSED",
]
allowed_copyleft_packages = [
  "python:cadquery-ocp",
  "python:casadi",
]
ignored_packages = [
  "python:mesh2param",
  "python:mesh2param-contracts",
]
required_notice_packages = [
  "python:cadquery",
  "python:cadquery-ocp",
  "python:casadi",
  "javascript:@fontsource/ibm-plex-mono",
  "javascript:@fontsource/ibm-plex-sans",
  "javascript:@playwright/test",
  "javascript:@react-three/drei",
  "javascript:@react-three/fiber",
  "javascript:dexie",
  "javascript:lucide-react",
  "javascript:react",
  "javascript:three",
  "javascript:vite",
]

[[overrides]]
ecosystem = "python"
name = "cadquery-ocp"
license = "Apache-2.0 AND LGPL-2.1-only WITH OCCT-exception-1.0"
source = "https://github.com/CadQuery/OCP/tree/7.9.3.1"
reason = "The Python bindings declare Apache-2.0 and the wheel bundles OCCT 7.9.3 shared libraries under LGPL-2.1 with the Open CASCADE exception."

[[overrides]]
ecosystem = "python"
name = "casadi"
license = "LGPL-3.0-or-later"
source = "https://github.com/casadi/casadi/tree/3.7.2"
reason = "The wheel metadata uses the non-SPDX text LGPLv3+; the upstream 3.7.2 license grants LGPL version 3 or any later version."

[[overrides]]
ecosystem = "python"
name = "matplotlib"
license = "LicenseRef-Matplotlib"
source = "https://github.com/matplotlib/matplotlib/blob/v3.10.8/LICENSE/LICENSE"
reason = "Matplotlib ships its own PSF-derived permissive license rather than an SPDX expression."

[[overrides]]
ecosystem = "python"
name = "python-dateutil"
license = "BSD-3-Clause OR Apache-2.0"
source = "https://github.com/dateutil/dateutil/blob/2.9.0.post0/LICENSE"
reason = "The wheel metadata says Dual License and supplies BSD and Apache classifiers."

