<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Mesh2Param</title>
  <rect width="48" height="48" rx="11" fill="#0b0f14"/>
  <g transform="translate(4 4)" stroke-linecap="round" stroke-linejoin="round">
    <!-- shaded cube faces: top + left stay raw mesh, right face resolved to an accent solid -->
    <path d="M20 20.1 5 11.4 20 2.7 35 11.4Z" fill="#bcd7f5" fill-opacity=".13"/>
    <path d="M20 20.1 5 11.4 5 28.5 20 37.2Z" fill="#bcd7f5" fill-opacity=".07"/>
    <path d="M20 20.1 35 11.4 35 28.5 20 37.2Z" fill="#4da3ff" fill-opacity=".30"/>
    <!-- triangulated mesh on the two raw faces -->
    <g fill="none" stroke="#bcd7f5" stroke-width="1" stroke-opacity=".6">
      <path d="M20 20.1L35 11.4M12.5 15.75L27.5 7.05M5 11.4L20 2.7M20 20.1L5 11.4M27.5 15.75L12.5 7.05M35 11.4L20 2.7M20 20.1L20 11.4M27.5 15.75L27.5 7.05M12.5 15.75L12.5 7.05M20 11.4L20 2.7"/>
      <path d="M20 20.1L20 37.2M12.5 15.75L12.5 32.85M5 11.4L5 28.5M20 20.1L5 11.4M20 28.65L5 19.95M20 37.2L5 28.5M20 20.1L12.5 24.3M20 28.65L12.5 32.85M12.5 15.75L5 19.95M12.5 24.3L5 28.5"/>
    </g>
    <!-- cube edges: the three that meet at the front corner read it as a solid box -->
    <g fill="none" stroke="#e3efff" stroke-width="1.6">
      <path d="M20 2.8 35 11.4v17.2L20 37.2 5 28.6V11.4Z"/>
      <path d="M20 20.1 5 11.4M20 20.1 35 11.4M20 20.1 20 37.2"/>
    </g>
    <!-- accent core -->
    <circle cx="20" cy="20.1" r="3" fill="#4da3ff"/>
  </g>
</svg>
