name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mesh2param-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      MESH2PARAM_ENVIRONMENT: test
      MESH2PARAM_DATA_DIR: ${{ runner.temp }}/mesh2param-data
      MESH2PARAM_DATABASE_URL: sqlite:///${{ runner.temp }}/mesh2param-data/mesh2param.sqlite3
      MESH2PARAM_STORAGE_PATH: ${{ runner.temp }}/mesh2param-data/storage
      MESH2PARAM_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MESH2PARAM_WORKER_COUNT: "1"
      MESH2PARAM_JOB_RUNNER_MODE: embedded
      MESH2PARAM_DEBUG: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.28
          enable-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache package downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ${{ env.UV_CACHE_DIR }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Install Chromium
        run: pnpm --filter @mesh2param/web exec playwright install --with-deps chromium

      - name: Run parity verification
        run: pnpm verify

      - name: Validate Cloudflare Worker bundle
        run: pnpm cf:check

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report
            test-results
            artifacts/acceptance
            artifacts/geometry-acceptance

  containers:
    name: Containers
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_IMAGE_TAG: ci
      COMPOSE_WEB_PORT: "18080"
      COMPOSE_PROJECT_NAME: mesh2param-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build pinned backend image
        run: docker build --file infra/backend.Dockerfile --tag mesh2param-backend:ci .

      - name: Build pinned web image
        run: docker build --file infra/web.Dockerfile --tag mesh2param-web:ci .

      - name: Create non-secret CI environment
        id: compose-env
        run: |
          ci_env="$RUNNER_TEMP/mesh2param-ci.env"
          cp .env.example "$ci_env"
          {
            echo 'COMPOSE_IMAGE_TAG=ci'
            echo 'COMPOSE_WEB_PORT=18080'
            echo 'MESH2PARAM_PUBLIC_URL=http://localhost:18080'
            echo 'MESH2PARAM_CORS_ORIGINS=http://localhost:18080,http://127.0.0.1:18080'
          } >> "$ci_env"
          echo "path=$ci_env" >> "$GITHUB_OUTPUT"

      - name: Validate Compose model
        run: >-
          docker compose
          --env-file "${{ steps.compose-env.outputs.path }}"
          --project-name "$COMPOSE_PROJECT_NAME"
          config --quiet

      - name: Start isolated deployment
        run: >-
          docker compose
          --env-file "${{ steps.compose-env.outputs.path }}"
          --project-name "$COMPOSE_PROJECT_NAME"
          up --detach --wait --no-build

      - name: Verify effective container security
        run: >-
          python3 scripts/verify_container_security.py
          --project-name "$COMPOSE_PROJECT_NAME"
          --web-port 18080
          --json-output artifacts/container-ci/security.json

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts/container-ci
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --format json \
            > artifacts/container-ci/compose-ps.json 2>&1 || true
          ids=$(docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --quiet 2>/dev/null || true)
          if [ -n "$ids" ]; then
            docker inspect $ids > artifacts/container-ci/inspect.json 2>&1 || true
          fi
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color \
            > artifacts/container-ci/compose.log 2>&1 || true

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: artifacts/container-ci

      - name: Remove isolated deployment
        if: always()
        run: >-
          docker compose
          --env-file "${{ steps.compose-env.outputs.path }}"
          --project-name "$COMPOSE_PROJECT_NAME"
          down --volumes --remove-orphans
