name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mesh2param-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
      id-token: write
    uses: esaueng/Mesh2Param/.github/workflows/ci-jobs.yml@f6d835a9438519d3403754d756820f014bd41f3e
